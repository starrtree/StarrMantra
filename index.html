<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="description" content="Starr Mantra — a swipeable StarrTree quote book." />
  <title>Starr Mantra</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#050505;
      --panel:rgba(6,7,10,.68);
      --panel-strong:rgba(7,8,12,.86);
      --cream:#fff7e8;
      --muted:rgba(255,247,232,.62);
      --gold:#ffd45c;
      --gold2:#f2a92f;
      --violet:#9b5cff;
      --violet2:#d25cff;
      --line:rgba(255,212,92,.20);
      --danger:#ffc1c1;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#050505;color:var(--cream)}
    body{overflow-x:hidden}
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    a{color:inherit}
    .app{position:relative;min-height:100svh;overflow:hidden;background:#050505}
    .media-layer,.still-layer,.video-layer,.veil,.stars{position:fixed;inset:0}
    .media-layer{z-index:0;overflow:hidden;background:#050505}
    .still-layer{
      background:
        linear-gradient(180deg,rgba(0,0,0,.22),rgba(0,0,0,.56)),
        url("public/assets/StarrX-CloseCard.png") center 24%/cover no-repeat;
      transform:scale(1.03);
      filter:saturate(.92) contrast(1.05);
    }
    .video-layer{
      width:100%;height:100%;object-fit:cover;
      opacity:0;transition:opacity .75s ease;
      filter:saturate(.96) brightness(.8) contrast(1.05);
    }
    .video-layer.playing{opacity:.94}
    .veil{
      background:
        radial-gradient(circle at 50% 28%,transparent 0 18%,rgba(0,0,0,.12) 42%,rgba(0,0,0,.56) 100%),
        linear-gradient(180deg,rgba(0,0,0,.2) 0%,rgba(0,0,0,.52) 78%,rgba(0,0,0,.74) 100%);
      backdrop-filter:blur(.2px);
    }
    .stars{
      pointer-events:none;opacity:.23;
      background-image:radial-gradient(rgba(255,255,255,.48) 1px,transparent 1px);
      background-size:42px 42px;
      mask-image:linear-gradient(to bottom,#000,transparent 90%);
    }
    .shell{
      position:relative;z-index:2;
      width:min(1160px,calc(100% - 28px));
      min-height:100svh;margin:auto;
      padding:max(16px,env(safe-area-inset-top)) 0 max(18px,env(safe-area-inset-bottom));
      display:flex;flex-direction:column;gap:15px
    }
    header{
      display:flex;justify-content:space-between;align-items:center;gap:18px;
      padding:5px 2px 0
    }
    .brand{display:flex;gap:14px;align-items:center;min-width:0}
    .logo-wrap{
      width:82px;height:82px;flex:none;display:grid;place-items:center;
      border-radius:24px;
      background:radial-gradient(circle,rgba(255,197,54,.09),transparent 66%);
      filter:drop-shadow(0 0 20px rgba(255,198,48,.16))
    }
    .logo-wrap img{width:100%;height:100%;object-fit:contain;mix-blend-mode:screen}
    .kicker{
      margin:0 0 4px;color:rgba(255,215,107,.74);
      font-size:.71rem;font-weight:900;letter-spacing:.27em;text-transform:uppercase
    }
    h1{
      margin:0;font-size:clamp(2.2rem,6.7vw,4.9rem);
      line-height:.9;letter-spacing:-.07em
    }
    .subtitle{
      margin:9px 0 0;max-width:650px;color:var(--muted);
      line-height:1.45;font-size:clamp(.9rem,2vw,1.04rem)
    }
    .actions,.tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
    .btn,.icon,.arrow{
      border:1px solid rgba(255,255,255,.11);
      background:rgba(10,9,15,.60);
      color:var(--cream);
      backdrop-filter:blur(15px);
      transition:transform .16s ease,background .16s ease,border-color .16s ease,box-shadow .16s ease
    }
    .btn:hover,.icon:hover,.arrow:hover{
      background:rgba(22,17,32,.72);
      border-color:rgba(255,212,92,.34)
    }
    .btn:active,.icon:active,.arrow:active{transform:scale(.96)}
    .btn{
      min-height:46px;border-radius:999px;padding:0 17px;
      display:inline-flex;gap:8px;align-items:center;justify-content:center;
      font-weight:850
    }
    .btn.primary{
      border:none;background:linear-gradient(135deg,#fff0b4,#ffd45c 48%,#b36cff 100%);
      color:#100b08;box-shadow:0 14px 42px rgba(255,202,69,.18)
    }
    .icon{
      width:46px;height:46px;border-radius:50%;display:grid;place-items:center
    }
    .icon.danger{color:var(--danger);border-color:rgba(255,94,94,.2)}
    .toolbar{
      display:grid;grid-template-columns:minmax(0,1fr) auto;
      gap:12px;align-items:center
    }
    .search{
      min-height:52px;border:1px solid rgba(255,255,255,.11);
      border-radius:22px;background:rgba(7,7,11,.62);
      display:flex;align-items:center;gap:10px;padding:0 15px;
      backdrop-filter:blur(16px)
    }
    .search input{
      width:100%;border:0;outline:0;background:transparent;color:var(--cream);font-size:1rem
    }
    .search input::placeholder{color:rgba(255,247,232,.36)}
    .cloud{
      display:inline-flex;gap:7px;align-items:center;min-height:38px;
      border:1px solid rgba(255,255,255,.08);border-radius:999px;
      padding:0 12px;background:rgba(6,7,10,.55);color:rgba(255,247,232,.57);
      font-size:.79rem;white-space:nowrap
    }
    .cloud-dot{width:7px;height:7px;border-radius:50%;background:#c9a9ff;box-shadow:0 0 12px rgba(181,111,255,.7)}
    .cloud.cloud-ok .cloud-dot{background:#79f0a8;box-shadow:0 0 12px rgba(121,240,168,.7)}
    .form{
      display:none;gap:10px;padding:14px;
      border:1px solid var(--line);border-radius:28px;
      background:rgba(6,7,10,.86);backdrop-filter:blur(19px);
      box-shadow:0 18px 70px rgba(0,0,0,.30)
    }
    .form.open{display:grid;animation:formIn .24s ease both}
    @keyframes formIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
    .form-head{display:flex;justify-content:space-between;align-items:center}
    .form textarea,.form input{
      width:100%;border:1px solid rgba(255,255,255,.11);
      outline:0;border-radius:18px;background:rgba(0,0,0,.26);
      color:var(--cream);padding:13px 14px
    }
    .form textarea{resize:vertical}
    .form-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:10px}
    .stage{
      position:relative;flex:1;min-height:500px;
      display:grid;grid-template-columns:72px minmax(0,1fr) 72px;
      gap:clamp(8px,2vw,21px);align-items:center
    }
    .zone{min-width:0;display:flex;justify-content:center;perspective:1300px}
    .card{
      position:relative;width:min(100%,780px);
      min-height:clamp(420px,59vh,610px);
      display:flex;flex-direction:column;justify-content:space-between;
      overflow:hidden;padding:clamp(24px,5vw,52px);
      border:1px solid rgba(255,219,108,.28);
      border-radius:clamp(30px,5vw,52px);
      background:
        radial-gradient(circle at 50% -4%,rgba(255,211,87,.17),transparent 34%),
        radial-gradient(circle at 100% 100%,rgba(164,88,255,.17),transparent 33%),
        linear-gradient(145deg,rgba(11,12,18,.91),rgba(4,5,8,.86));
      box-shadow:
        0 36px 120px rgba(0,0,0,.55),
        0 0 0 1px rgba(255,255,255,.025) inset,
        0 0 62px rgba(125,70,220,.10);
      touch-action:pan-y;user-select:none;will-change:transform,opacity;
      transition:transform .18s cubic-bezier(.2,.9,.2,1),border-color .16s ease
    }
    .card:before{
      content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
      background:
        linear-gradient(rgba(255,255,255,.026) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
      background-size:42px 42px;
      mask-image:radial-gradient(circle at 50% 45%,#000,transparent 84%)
    }
    .card:after{
      content:"✦";position:absolute;right:-14px;top:-48px;
      color:rgba(255,214,92,.06);font-size:17rem;line-height:1;
      transform:rotate(12deg);pointer-events:none
    }
    .card.dragging{transition:none;border-color:rgba(188,108,255,.50)}
    .card.enter-right{animation:enterRight .46s cubic-bezier(.16,.8,.22,1) both}
    .card.enter-left{animation:enterLeft .46s cubic-bezier(.16,.8,.22,1) both}
    .card.shuffle-in{animation:shuffleIn .58s cubic-bezier(.13,.84,.26,1) both}
    .card.exit-left{animation:exitLeft .34s cubic-bezier(.4,0,.7,.2) both}
    .card.exit-right{animation:exitRight .34s cubic-bezier(.4,0,.7,.2) both}
    .card.shuffle-out{animation:shuffleOut .36s ease both}
    @keyframes enterRight{
      from{opacity:0;transform:translate3d(90px,20px,-60px) rotate(6deg) scale(.92)}
      to{opacity:1;transform:none}
    }
    @keyframes enterLeft{
      from{opacity:0;transform:translate3d(-90px,20px,-60px) rotate(-6deg) scale(.92)}
      to{opacity:1;transform:none}
    }
    @keyframes exitLeft{
      to{opacity:0;transform:translate3d(-125%,20px,-120px) rotate(-13deg) scale(.88)}
    }
    @keyframes exitRight{
      to{opacity:0;transform:translate3d(125%,20px,-120px) rotate(13deg) scale(.88)}
    }
    @keyframes shuffleOut{
      0%{opacity:1;transform:none}
      38%{transform:translateY(-12px) rotate(-4deg) scale(.98)}
      100%{opacity:0;transform:translate(44px,-12px) rotate(9deg) scale(.88)}
    }
    @keyframes shuffleIn{
      0%{opacity:0;transform:translate(-55px,16px) rotate(-9deg) scale(.9)}
      58%{opacity:1;transform:translate(7px,-4px) rotate(1.2deg) scale(1.015)}
      100%{transform:none}
    }
    .topline,.quote,.card footer{position:relative;z-index:1}
    .topline{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .tag{
      display:inline-flex;align-items:center;gap:7px;
      border:1px solid rgba(255,214,92,.22);border-radius:999px;
      padding:8px 12px;background:rgba(255,209,73,.07);
      color:#ffe9a4;font-weight:850;font-size:.82rem
    }
    .staricon{
      color:var(--gold);font-size:1.25rem;
      text-shadow:0 0 18px rgba(255,210,67,.52)
    }
    .quote{
      margin:29px 0;font-family:Georgia,"Times New Roman",serif;
      font-weight:700;font-size:clamp(2rem,6vw,4.8rem);
      line-height:1.04;letter-spacing:-.045em;text-wrap:balance
    }
    .card footer{
      border-top:1px solid rgba(255,214,92,.16);
      padding-top:20px;display:flex;justify-content:space-between;
      gap:16px;align-items:flex-end
    }
    .byline{min-width:0}
    .author{
      margin:0;color:#ffe39a;font-weight:900;
      font-size:clamp(1.05rem,2vw,1.35rem)
    }
    .source{display:block;margin-top:5px;color:rgba(255,247,232,.54)}
    .source-link{
      flex:none;display:inline-flex;align-items:center;gap:6px;
      min-height:36px;padding:0 12px;border-radius:999px;
      border:1px solid rgba(178,105,255,.25);
      background:rgba(121,72,190,.13);
      text-decoration:none;color:#e6d2ff;font-size:.78rem;font-weight:800
    }
    .source-link:hover{background:rgba(121,72,190,.23)}
    .swipe{
      position:absolute;left:50%;bottom:15px;transform:translateX(-50%);
      color:rgba(255,247,232,.29);font-size:.69rem;
      font-weight:900;letter-spacing:.14em;text-transform:uppercase
    }
    .arrow{
      width:62px;height:62px;border-radius:50%;display:grid;place-items:center;
      color:#ffe39a;font-size:2rem;z-index:5;
      box-shadow:0 14px 40px rgba(0,0,0,.3)
    }
    .arrow.left{justify-self:start}.arrow.right{justify-self:end}
    .empty{
      width:min(100%,780px);min-height:360px;padding:32px;
      border:1px solid rgba(255,255,255,.1);border-radius:38px;
      background:rgba(7,8,12,.73);display:grid;place-items:center;
      text-align:center;color:var(--muted)
    }
    .status{
      display:flex;justify-content:center;gap:8px;flex-wrap:wrap;
      color:rgba(255,247,232,.48);font-size:.83rem
    }
    .pill{
      min-height:30px;border:1px solid rgba(255,255,255,.08);
      border-radius:999px;padding:0 10px;display:inline-flex;
      align-items:center;gap:5px;background:rgba(8,8,12,.46);backdrop-filter:blur(10px)
    }
    .toast{
      position:fixed;z-index:50;left:50%;
      bottom:max(20px,env(safe-area-inset-bottom));
      transform:translate(-50%,20px);opacity:0;pointer-events:none;
      background:rgba(7,8,12,.94);border:1px solid var(--line);
      border-radius:999px;padding:10px 14px;color:var(--cream);
      transition:.2s ease;box-shadow:0 14px 40px rgba(0,0,0,.35)
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}
    @media (prefers-reduced-motion:reduce){
      .video-layer{display:none}
      .card,.form{animation:none!important;transition:none!important}
    }
    @media(max-width:780px){
      .shell{width:min(100% - 18px,620px);gap:13px}
      header{align-items:flex-start;flex-direction:column}
      .actions{width:100%}
      .actions .btn{width:100%}
      .toolbar{grid-template-columns:1fr}
      .tools{justify-content:space-between}
      .cloud{flex:1;justify-content:center}
      .form-grid{grid-template-columns:1fr}
      .stage{min-height:520px;grid-template-columns:1fr}
      .zone{padding:0 43px}
      .card{min-height:min(63svh,560px)}
      .arrow{
        position:absolute;top:50%;transform:translateY(-50%);
        width:48px;height:48px;font-size:1.55rem;background:rgba(8,8,12,.82)
      }
      .arrow:active{transform:translateY(-50%) scale(.96)}
      .arrow.left{left:0}.arrow.right{right:0}
      .quote{font-size:clamp(1.95rem,9vw,3.15rem)}
      .card footer{align-items:flex-start;flex-direction:column}
      .source-link{align-self:flex-start}
    }
    @media(max-width:430px){
      .shell{width:min(100% - 12px,430px)}
      .logo-wrap{width:66px;height:66px}
      .brand{gap:10px}
      .subtitle{font-size:.9rem}
      .zone{padding:0 34px}
      .card{padding:22px 20px 34px;border-radius:30px;min-height:60svh}
      .arrow{width:43px;height:43px}
      .tag{max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .swipe{display:none}
    }
  </style>
</head>
<body>
<main class="app">
  <div class="media-layer" aria-hidden="true">
    <div class="still-layer"></div>
    <video class="video-layer" id="bgVideo" autoplay muted loop playsinline preload="metadata" poster="public/assets/StarrX-CloseCard.png">
      <source src="public/assets/StarrX-Hover.webm" type="video/webm" />
      <source src="public/assets/StarrX-Hover.mp4" type="video/mp4" />
    </video>
    <div class="veil"></div>
    <div class="stars"></div>
  </div>

  <section class="shell">
    <header>
      <div class="brand">
        <div class="logo-wrap">
          <img src="public/assets/StarrTree_LOGO.png" alt="StarrTree logo" />
        </div>
        <div>
          <p class="kicker">StarrTree Archive</p>
          <h1>Starr Mantra</h1>
          <p class="subtitle">A living quote book for the ideas that shape who you are becoming.</p>
        </div>
      </div>
      <div class="actions">
        <button class="btn primary" id="openForm">＋ Add a mantra</button>
      </div>
    </header>

    <section class="toolbar">
      <label class="search">⌕<input id="searchInput" placeholder="Search quote, author, source, tag..." autocomplete="off" /></label>
      <div class="tools">
        <button class="icon" id="shuffleBtn" aria-label="Shuffle quotes" title="Shuffle">⤨</button>
        <button class="icon danger" id="deleteBtn" aria-label="Delete quote" title="Delete quote">⌫</button>
        <span class="cloud" id="cloudState"><span class="cloud-dot"></span><span id="cloudText">Connecting…</span></span>
      </div>
    </section>

    <form class="form" id="quoteForm">
      <div class="form-head">
        <strong>Plant a new mantra</strong>
        <button class="icon" type="button" id="closeForm" aria-label="Close">×</button>
      </div>
      <textarea id="quoteText" rows="4" placeholder="Quote text" required></textarea>
      <div class="form-grid">
        <input id="quoteAuthor" placeholder="Author / speaker" />
        <input id="quoteTag" placeholder="Tag — Vision, Discipline, Becoming..." />
        <input id="quoteSource" placeholder="Source title — book, song, speech..." />
        <input id="quoteSourceUrl" type="url" inputmode="url" placeholder="Source link — https://..." />
      </div>
      <button class="btn primary" type="submit">＋ Add to the tree</button>
    </form>

    <section class="stage" aria-label="Swipeable mantra cards">
      <button class="arrow left" id="prevBtn" aria-label="Previous quote">‹</button>
      <div class="zone" id="cardZone"></div>
      <button class="arrow right" id="nextBtn" aria-label="Next quote">›</button>
    </section>

    <section class="status">
      <span class="pill" id="counter">0 / 0</span>
      <span class="pill" id="savedCount">✦ 0 mantras</span>
      <span class="pill">Swipe • reflect • become</span>
    </section>
  </section>

  <div class="toast" id="toast"></div>
</main>

<script>
  const STORAGE_KEY='starr-mantra-quotes-v3';
  const API_URL='api/quotes';
  const SWIPE_THRESHOLD=55;
  const starterQuotes=[
    {id:'starter-einstein',text:'Imagination is more important than knowledge.',author:'Albert Einstein',source:'',source_url:'',tag:'Vision'},
    {id:'starter-nietzsche',text:'One must still have chaos in oneself to be able to give birth to a dancing star.',author:'Friedrich Nietzsche',source:'Thus Spoke Zarathustra',source_url:'',tag:'Creative Fire'},
    {id:'starter-shakespeare',text:'We know what we are, but know not what we may be.',author:'William Shakespeare',source:'Hamlet',source_url:'',tag:'Becoming'},
    {id:'starter-thinkdifferent',text:'The people who are crazy enough to think they can change the world are the ones who do.',author:'Apple',source:'Think Different',source_url:'',tag:'Change'}
  ];

  let quotes=[];
  let filtered=[];
  let index=0;
  let cloudMode=false;
  let transitioning=false;
  let startX=null,startY=null,dragX=0,dragging=false;

  const zone=document.getElementById('cardZone');
  const searchInput=document.getElementById('searchInput');
  const form=document.getElementById('quoteForm');
  const toast=document.getElementById('toast');
  const cloudState=document.getElementById('cloudState');
  const cloudText=document.getElementById('cloudText');

  function id(){
    return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():'q-'+Date.now()+'-'+Math.random().toString(16).slice(2)
  }
  function esc(s){
    return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))
  }
  function safeUrl(url){
    try{
      const u=new URL(url);
      return /^https?:$/.test(u.protocol)?u.href:'';
    }catch{return ''}
  }
  function localLoad(){
    try{
      const x=JSON.parse(localStorage.getItem(STORAGE_KEY));
      return Array.isArray(x)&&x.length?x:starterQuotes.slice()
    }catch{return starterQuotes.slice()}
  }
  function localSave(){
    localStorage.setItem(STORAGE_KEY,JSON.stringify(quotes))
  }
  function active(){return filtered[index]||null}
  function show(msg){
    toast.textContent=msg;
    toast.classList.add('show');
    clearTimeout(show.t);
    show.t=setTimeout(()=>toast.classList.remove('show'),1650)
  }
  function setCloud(ok,label){
    cloudMode=ok;
    cloudState.classList.toggle('cloud-ok',ok);
    cloudText.textContent=label
  }

  async function loadQuotes(){
    setCloud(false,'Connecting…');
    try{
      const res=await fetch(API_URL,{headers:{Accept:'application/json'}});
      if(!res.ok)throw new Error('No API');
      const data=await res.json();
      if(!Array.isArray(data))throw new Error('Bad API response');
      quotes=data.length?data:starterQuotes.slice();
      setCloud(true,'Cloud synced')
    }catch{
      quotes=localLoad();
      setCloud(false,'Local mode')
    }
    applyFilter(false)
  }

  function cardMarkup(q){
    const url=safeUrl(q.source_url||'');
    return '<article class="card" id="quoteCard">'+
      '<div class="topline"><span class="tag">⌁ '+esc(q.tag||'Mantra')+'</span><span class="staricon">✦</span></div>'+
      '<blockquote class="quote">“'+esc(q.text)+'”</blockquote>'+
      '<footer><div class="byline"><p class="author">— '+esc(q.author||'Unknown')+'</p>'+
      (q.source?'<span class="source">'+esc(q.source)+'</span>':'')+
      '</div>'+
      (url?'<a class="source-link" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Source ↗</a>':'')+
      '</footer><div class="swipe">Swipe left or right</div></article>'
  }

  function render(enterClass=''){
    const q=active();
    if(!q){
      zone.innerHTML='<div class="empty"><div><div style="font-size:2rem">✦</div><p>No mantras found. Clear search or add a new one.</p></div></div>'
    }else{
      zone.innerHTML=cardMarkup(q);
      const card=document.getElementById('quoteCard');
      if(enterClass){
        card.classList.add(enterClass);
        card.addEventListener('animationend',()=>card.classList.remove(enterClass),{once:true})
      }
      bindSwipe()
    }
    document.getElementById('counter').textContent=filtered.length?(index+1)+' / '+filtered.length:'0 / 0';
    document.getElementById('savedCount').textContent='✦ '+quotes.length+' mantra'+(quotes.length===1?'':'s')
  }

  function applyFilter(animate=false){
    const s=searchInput.value.trim().toLowerCase();
    filtered=!s?quotes.slice():quotes.filter(q=>[q.text,q.author,q.source,q.tag].join(' ').toLowerCase().includes(s));
    index=0;
    render(animate?'shuffle-in':'')
  }

  function moveIndex(dir){
    if(!filtered.length)return;
    index=(index+dir+filtered.length)%filtered.length
  }

  function transition(dir,kind='swipe'){
    if(transitioning||filtered.length<2)return;
    transitioning=true;
    const card=document.getElementById('quoteCard');
    if(!card){moveIndex(dir);render();transitioning=false;return}
    const outClass=kind==='shuffle'?'shuffle-out':(dir>0?'exit-left':'exit-right');
    card.style.transform='';
    card.classList.remove('dragging');
    card.classList.add(outClass);
    const done=()=>{
      moveIndex(dir);
      render(kind==='shuffle'?'shuffle-in':(dir>0?'enter-right':'enter-left'));
      transitioning=false
    };
    card.addEventListener('animationend',done,{once:true});
    setTimeout(()=>{if(transitioning)done()},460)
  }

  function next(){transition(1,'swipe')}
  function prev(){transition(-1,'swipe')}
  function shuffle(){
    if(filtered.length<2||transitioning)return;
    let target=Math.floor(Math.random()*filtered.length);
    if(target===index)target=(target+1)%filtered.length;
    transitioning=true;
    const card=document.getElementById('quoteCard');
    const finish=()=>{
      index=target;
      render('shuffle-in');
      transitioning=false
    };
    if(!card){finish();return}
    card.classList.add('shuffle-out');
    card.addEventListener('animationend',finish,{once:true});
    setTimeout(()=>{if(transitioning)finish()},460)
  }

  function bindSwipe(){
    const card=document.getElementById('quoteCard');if(!card)return;
    card.addEventListener('pointerdown',e=>{
      if(transitioning)return;
      if(e.pointerType==='mouse'&&e.button!==0)return;
      card.setPointerCapture(e.pointerId);
      startX=e.clientX;startY=e.clientY;dragX=0;dragging=true;
      card.classList.add('dragging')
    });
    card.addEventListener('pointermove',e=>{
      if(!dragging)return;
      const dx=e.clientX-startX,dy=e.clientY-startY;
      if(Math.abs(dx)>Math.abs(dy)){
        e.preventDefault();
        dragX=dx;
        const rot=Math.max(-9,Math.min(9,dragX/21));
        const scale=1-Math.min(Math.abs(dragX)/1800,.035);
        card.style.transform='translateX('+dragX+'px) rotate('+rot+'deg) scale('+scale+')'
      }
    });
    const end=()=>{
      if(!dragging)return;
      dragging=false;card.classList.remove('dragging');
      const final=dragX;startX=startY=null;dragX=0;
      if(final>SWIPE_THRESHOLD){
        card.style.transform='';
        transition(-1,'swipe')
      }else if(final<-SWIPE_THRESHOLD){
        card.style.transform='';
        transition(1,'swipe')
      }else{
        card.style.transform=''
      }
    };
    card.addEventListener('pointerup',end);
    card.addEventListener('pointercancel',end)
  }

  function getWriteKey(force=false){
    const storageKey='starr-mantra-write-key';
    if(force)localStorage.removeItem(storageKey);
    let key=localStorage.getItem(storageKey)||'';
    if(!key){
      key=(window.prompt('Enter your private Starr Mantra edit key')||'').trim();
      if(key)localStorage.setItem(storageKey,key)
    }
    return key
  }

  async function cloudWrite(url,options={}){
    let key=getWriteKey(false);
    if(!key)throw new Error('Edit key required');
    const send=()=>fetch(url,{
      ...options,
      headers:{...(options.headers||{}),'x-mantra-key':key}
    });
    let res=await send();
    if(res.status===401){
      key=getWriteKey(true);
      if(!key)throw new Error('Edit key required');
      res=await send()
    }
    return res
  }

  async function createQuote(q){
    if(cloudMode){
      const res=await cloudWrite(API_URL,{
        method:'POST',
        headers:{'Content-Type':'application/json',Accept:'application/json'},
        body:JSON.stringify(q)
      });
      if(!res.ok)throw new Error('Save failed');
      return await res.json()
    }
    const local={...q,id:id(),created_at:new Date().toISOString()};
    quotes.unshift(local);localSave();
    return local
  }

  async function deleteQuote(q){
    if(cloudMode){
      const res=await cloudWrite(API_URL+'?id='+encodeURIComponent(q.id),{method:'DELETE'});
      if(!res.ok)throw new Error('Delete failed');
    }else{
      quotes=quotes.filter(x=>x.id!==q.id);
      localSave()
    }
  }

  document.getElementById('prevBtn').onclick=prev;
  document.getElementById('nextBtn').onclick=next;
  document.getElementById('shuffleBtn').onclick=shuffle;
  document.getElementById('openForm').onclick=()=>form.classList.add('open');
  document.getElementById('closeForm').onclick=()=>form.classList.remove('open');
  searchInput.addEventListener('input',()=>applyFilter(false));
  window.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft')prev();
    if(e.key==='ArrowRight')next()
  });

  form.addEventListener('submit',async e=>{
    e.preventDefault();
    const text=document.getElementById('quoteText').value.trim();
    if(!text)return;
    const q={
      text,
      author:document.getElementById('quoteAuthor').value.trim()||'Unknown',
      tag:document.getElementById('quoteTag').value.trim()||'Mantra',
      source:document.getElementById('quoteSource').value.trim(),
      source_url:document.getElementById('quoteSourceUrl').value.trim()
    };
    const submit=form.querySelector('button[type="submit"]');
    submit.disabled=true;submit.textContent='Saving…';
    try{
      const saved=await createQuote(q);
      if(cloudMode)quotes.unshift(saved);
      form.reset();form.classList.remove('open');searchInput.value='';
      applyFilter(true);
      show(cloudMode?'Mantra saved to the constellation ✦':'Mantra saved on this device ✦')
    }catch{
      show('Could not save — try again')
    }finally{
      submit.disabled=false;submit.textContent='＋ Add to the tree'
    }
  });

  document.getElementById('deleteBtn').onclick=async()=>{
    const q=active();if(!q)return;
    try{
      await deleteQuote(q);
      if(cloudMode)quotes=quotes.filter(x=>x.id!==q.id);
      applyFilter(true);
      show('Mantra removed')
    }catch{show('Could not remove mantra')}
  };

  function setupBackground(){
    const video=document.getElementById('bgVideo');
    if(!video)return;
    if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      video.remove();return
    }
    let played=false;
    const markPlaying=()=>{played=true;video.classList.add('playing')};
    video.addEventListener('playing',markPlaying,{once:true});
    video.addEventListener('error',()=>video.classList.remove('playing'));
    const attempt=video.play();
    if(attempt&&typeof attempt.catch==='function'){
      attempt.catch(()=>video.classList.remove('playing'))
    }
    setTimeout(()=>{
      if(!played||video.paused)video.classList.remove('playing')
    },1800);
    document.addEventListener('visibilitychange',()=>{
      if(!document.hidden&&video.paused){
        const p=video.play();
        if(p&&typeof p.catch==='function')p.catch(()=>video.classList.remove('playing'))
      }
    })
  }

  setupBackground();
  loadQuotes();
</script>
</body>
